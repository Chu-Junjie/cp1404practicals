<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temperature Converter</title>
</head>
<body>
    <h1>Celsius to Fahrenheit</h1>
    <form method="post" action="/convert">
        <label for="celsius">Celsius:</label>
        <input type="text" name="celsius" id="celsius" required>
        <input type="submit" value="Convert to Fahrenheit">
    </form>

    {% if result %}
        <p><strong>Result:</strong> {{ result }}</p>
    {% endif %}

    <hr>

    <h1>Fahrenheit to Celsius</h1>
    <form method="post" action="/convert_f">
        <label for="fahrenheit">Fahrenheit:</label>
        <input type="text" name="fahrenheit" id="fahrenheit" required>
        <input type="submit" value="Convert to Celsius">
    </form>

    {% if result_f %}
        <p><strong>Result:</strong> {{ result_f }}</p>
    {% endif %}
</body>
</html>
